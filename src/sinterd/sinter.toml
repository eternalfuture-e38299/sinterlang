[package]
name = "sinterd"
version = "file:../version.txt"
entry = "src/main.sinter"
description = "Self-hosted Sinter backend daemon (format / tokens / diagnostics)"
authors = ["sinter"]
license = "MIT"
artifact = "exe"

[dependencies]
std = { version = "1.5.2", source = "path:../../packages/std" }
json = { version = "1.0.0", source = "path:../../packages/json" }
syntax = { version = "1.0.0", source = "path:../libs/syntax" }
cfront = { version = "1.0.0", source = "path:../libs/cfront" }
sfmt = { version = "1.0.0", source = "path:../libs/sfmt" }
sver = { version = "1.0.0", source = "path:../libs/sver" }

[build]
opt = "2"
